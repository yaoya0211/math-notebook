<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ee">
<title>数学错题本 · 二年级</title>
<style>
  :root {
    --paper: #f7f4ee;
    --card: #fffdf9;
    --ink: #2b2b2b;
    --muted: #7b756b;
    --line: #e8e2d6;
    --green: #2f6f5e;
    --green-soft: #e6f0ec;
    --red: #b5533f;
    --red-soft: #f7e9e5;
    --amber: #8a6a2f;
    --amber-soft: #f3ecdc;
    --blue: #3d5a80;
    --blue-soft: #e7ecf3;
    --shadow: 0 1px 2px rgba(58, 48, 32, .06), 0 10px 28px rgba(58, 48, 32, .07);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background:
      radial-gradient(1200px 500px at 80% -100px, #fdfbf5 0%, transparent 60%),
      var(--paper);
    color: var(--ink);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 780px; margin: 0 auto; padding: 26px 16px 80px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 25px; letter-spacing: .5px; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .updated { color: var(--muted); font-size: 12px; white-space: nowrap; }

  .syncline {
    margin: 10px 0 0; font-size: 12.5px; color: var(--muted);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 7px 12px;
  }
  .syncline.ok { color: var(--green); background: var(--green-soft); border-color: #cfe3da; }
  .syncline.warn { color: var(--amber); background: var(--amber-soft); border-color: #e6d9bd; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 16px 0 14px; }
  .stat {
    background: var(--card); border: 1px solid var(--line); border-radius: 13px;
    padding: 12px 13px; box-shadow: var(--shadow);
  }
  .stat .k { color: var(--muted); font-size: 12px; letter-spacing: .3px; }
  .stat .v { font-size: 24px; font-weight: 600; margin-top: 1px; font-variant-numeric: tabular-nums; }
  .stat .v small { font-size: 12px; font-weight: 400; color: var(--muted); margin-left: 2px; }
  .statnote { margin: -4px 2px 14px; font-size: 12.5px; color: var(--amber); display: none; }
  .statnote.on { display: block; }
  .stat.clickable { cursor: pointer; }
  .stat.clickable:hover { border-color: #d6c9b2; }

  .typepanel {
    background: var(--card); border: 1px solid var(--line); border-radius: 13px;
    box-shadow: var(--shadow); padding: 6px 14px 6px; margin: -2px 0 14px;
  }
  .typepanel .phead { display: flex; align-items: center; justify-content: space-between; padding: 5px 0 6px; font-size: 13px; color: var(--muted); }
  .typepanel .pclose { border: 0; background: none; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; padding: 4px; }
  .typerow {
    display: flex; width: 100%; align-items: baseline; justify-content: space-between; gap: 10px;
    padding: 10px 2px; border: 0; border-top: 1px dashed var(--line); background: none;
    font: inherit; text-align: left; cursor: pointer; color: var(--ink);
  }
  .typerow .tname { font-size: 14px; }
  .typerow .tname b { font-weight: 600; color: var(--green); }
  .typerow .tmeta { font-size: 12px; color: var(--muted); white-space: nowrap; }

  .toolbar { display: flex; flex-direction: column; gap: 10px; margin: 4px 0 16px; }
  .searchrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #search {
    flex: 1 1 220px; min-width: 180px; padding: 10px 13px; font: inherit; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  #search:focus { border-color: #c9bfa9; box-shadow: 0 0 0 3px rgba(201, 191, 169, .22); }
  .demotoggle { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); user-select: none; cursor: pointer; }
  .demotoggle input { accent-color: var(--green); width: 15px; height: 15px; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chip.on { background: var(--green); border-color: var(--green); color: #fff; }
  .chip .n { opacity: .65; margin-left: 3px; font-size: 12px; }
  .subchips { margin-top: 7px; }
  .subchips .chip { font-size: 12.5px; padding: 5px 11px; }

  .cards { display: flex; flex-direction: column; gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .thumb {
    border: 0; padding: 10px; background: #fbf9f3; cursor: zoom-in; width: 100%;
    display: flex; align-items: center; justify-content: center;
    border-bottom: 1px dashed var(--line);
  }
  .thumb img { max-width: 100%; max-height: 150px; object-fit: contain; display: block; border-radius: 6px; }
  .thumb .empty-thumb { color: #b8b0a1; font-size: 12px; padding: 22px 8px; }
  .body { padding: 14px 15px 12px; min-width: 0; }
  .meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .badge { border-radius: 999px; padding: 2px 9px; font-size: 11.5px; }
  .badge.type { background: var(--blue-soft); color: var(--blue); }
  .badge.sub { background: var(--green-soft); color: var(--green); }
  .badge.demo { background: var(--amber-soft); color: var(--amber); }
  .badge.new { background: #e8eef7; color: #33507a; }
  .q { margin: 7px 0 9px; font-size: 16.5px; font-weight: 600; line-height: 1.55; word-break: break-word; }
  .answers { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 7px; }
  .ans { display: flex; align-items: baseline; gap: 6px; border-radius: 9px; padding: 5px 10px; font-size: 13.5px; }
  .ans label { font-size: 11px; letter-spacing: .5px; }
  .ans.wrong { background: var(--red-soft); color: #8f3a29; }
  .ans.right { background: var(--green-soft); color: #245a4b; }
  .ans.new { background: #e8eef7; color: #33507a; }
  .ans b { font-weight: 600; }
  .reason { margin: 0 0 10px; font-size: 13px; color: #6b655a; }
  .reason::before { content: "错因 · "; color: var(--muted); }
  .foot { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
  .foot .acc { font-weight: 600; }
  .foot .acc.good { color: var(--green); }
  .foot .acc.mid { color: var(--amber); }
  .foot .acc.bad { color: var(--red); }
  .more, .logbtn {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .logbtn { color: var(--green); border-color: #cddfd7; background: #f2f8f5; }
  .more { margin-left: auto; }
  .dl {
    border: 1px solid #cddfd7; background: #f2f8f5; color: #2f6f5e;
    border-radius: 8px; padding: 6px 11px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  .details { display: none; margin-top: 13px; border-top: 1px dashed var(--line); padding-top: 11px; }
  .details.open { display: block; }
  .details h4 { margin: 0 0 7px; font-size: 12.5px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
  .similar { margin: 0 0 14px; padding: 0; list-style: none; counter-reset: s; }
  .similar li {
    counter-increment: s; padding: 8px 0 8px 28px; border-bottom: 1px dotted var(--line);
    font-size: 13.5px; position: relative;
  }
  .similar li::before {
    content: counter(s); position: absolute; left: 0; top: 9px;
    width: 18px; height: 18px; border-radius: 50%; background: var(--green-soft); color: var(--green);
    font-size: 11px; display: flex; align-items: center; justify-content: center;
  }
  .similar li:last-child { border-bottom: 0; }
  .similar .a { color: var(--muted); font-size: 12.5px; margin-left: 5px; }
  .similar .a::before { content: "答："; opacity: .7; }
  table.log { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.log th, table.log td { text-align: left; padding: 6px 5px; border-bottom: 1px solid var(--line); }
  table.log th { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  table.log tr:last-child td { border-bottom: 0; }
  table.log a { color: var(--blue); text-decoration: none; }
  .no-practice { color: var(--muted); font-size: 12.5px; margin: 0; }
  .fl-row { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 8px; }
  .pending { margin: -4px 0 14px; font-size: 12.5px; color: var(--amber); }
  .action {
    border: 0; background: var(--green); color: #fff; border-radius: 999px;
    padding: 9px 18px; font: inherit; font-size: 13.5px; cursor: pointer;
    box-shadow: 0 6px 16px rgba(47,111,94,.18);
  }
  .action:hover { filter: brightness(1.06); }
  .action:disabled { opacity: .55; filter: none; cursor: default; }
  .action.ghost { background: #fff; color: var(--green); border: 1px solid #cddfd7; box-shadow: none; }
  .action.ghost:hover { background: var(--green-soft); filter: none; }
  .top { padding: 9px 16px; font-size: 13.5px; white-space: nowrap; }

  .empty {
    background: var(--card); border: 1px dashed #d8cfbd; border-radius: 16px;
    padding: 36px 22px; text-align: center; color: var(--muted);
  }
  .empty h3 { margin: 0 0 8px; color: var(--ink); font-size: 17px; }
  .empty ol { display: inline-block; text-align: left; margin: 10px 0 0; padding-left: 20px; font-size: 14px; }
  .empty li { margin: 3px 0; }

  footer { margin-top: 30px; color: #a39a8a; font-size: 11.5px; text-align: center; line-height: 1.8; }

  .modal {
    position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
    background: rgba(38, 34, 28, .62); padding: 24px; backdrop-filter: blur(2px);
  }
  .modal.open { display: flex; }
  .modal-inner { position: relative; max-width: min(1000px, 96vw); max-height: 92vh; display: flex; flex-direction: column; gap: 10px; }
  .modal img { max-width: 100%; max-height: 78vh; object-fit: contain; background: #fff; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .modal-close {
    position: absolute; top: -14px; right: -14px; width: 34px; height: 34px; border-radius: 50%;
    border: 0; background: #fff; color: #444; font-size: 18px; cursor: pointer; box-shadow: 0 6px 18px rgba(0,0,0,.25);
  }

  .picker {
    background: var(--card); color: var(--ink); border-radius: 16px; box-shadow: 0 24px 70px rgba(0,0,0,.35);
    width: min(520px, 94vw); max-height: 86vh; display: flex; flex-direction: column; padding: 18px 20px 16px;
  }
  .picker-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .picker-head h3 { margin: 0; font-size: 17px; }
  .picker-close { border: 0; background: none; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; }
  .picker-tip { margin: 6px 0 8px; font-size: 12.5px; color: var(--muted); }
  .picker-list { overflow: auto; border-top: 1px solid var(--line); }
  .picker-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 2px; border-bottom: 1px solid var(--line); }
  .picker-row .name { display: flex; flex-direction: column; gap: 1px; font-size: 13.5px; }
  .picker-row .name b { color: var(--green); font-weight: 600; }
  .picker-row .avail { font-size: 11.5px; color: var(--muted); }
  .picker-row input {
    width: 64px; padding: 6px 8px; font: inherit; font-size: 14px; text-align: center;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
  }
  .picker-row input:focus { outline: none; border-color: #c9bfa9; box-shadow: 0 0 0 3px rgba(201,191,169,.22); }
  .picker-foot { display: flex; align-items: center; gap: 10px; padding-top: 12px; }
  .picker-foot #dlTotal { margin-right: auto; font-size: 13px; color: var(--muted); }
  .picker-cancel {
    border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px;
    padding: 8px 16px; font: inherit; font-size: 13.5px; cursor: pointer;
  }
  .action:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; }

  .sheet { align-items: flex-end; padding: 0; }
  .sheet-inner {
    width: 100%; max-width: 520px; max-height: 92vh; overflow-y: auto;
    background: var(--card); border-radius: 18px 18px 0 0; padding: 18px 18px 22px;
    box-shadow: 0 -12px 40px rgba(38,34,28,.22);
  }
  .fhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .fhead h3 { margin: 0; font-size: 18px; }
  .fhead .x { border: 0; background: none; font-size: 22px; color: var(--muted); cursor: pointer; padding: 2px 6px; }
  .fhint { margin: 4px 0 14px; font-size: 12.5px; color: var(--muted); }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field span { font-size: 12.5px; color: var(--muted); }
  .field input, .field select {
    width: 100%; padding: 10px 12px; font: inherit; color: var(--ink);
    background: #fff; border: 1px solid var(--line); border-radius: 10px; outline: none;
  }
  .field input:focus, .field select:focus { border-color: #c9bfa9; box-shadow: 0 0 0 3px rgba(201, 191, 169, .22); }
  .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ferror { margin: 2px 0 10px; min-height: 18px; font-size: 12.5px; color: var(--red); }
  .factions { display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
  .ghost {
    border: 1px solid var(--line); background: #fff; color: var(--muted);
    border-radius: 999px; padding: 9px 18px; font: inherit; font-size: 13.5px; cursor: pointer;
  }

  .toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 12px);
    background: rgba(43, 43, 43, .94); color: #fff; font-size: 13px;
    padding: 9px 16px; border-radius: 999px; opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease; z-index: 70; max-width: 88vw; text-align: center;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 820px) {
    .wrap { padding: 20px 13px 76px; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 23px; }
    .sub { font-size: 12.5px; }
    .foot { gap: 8px; }
    .more { margin-left: 0; }
    .modal { padding: 16px; }
  }
  @media (min-width: 821px) {
    .sheet { align-items: center; }
    .sheet-inner { border-radius: 18px; padding: 22px 22px 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>数学错题本</h1>
      <p class="sub">二年级 · 错题归类 · 举一反三</p>
    </div>
    <button class="action top" id="logNew" type="button">＋ 登记练习</button>
  </header>

  <div class="syncline" id="sync">正在读取练习记录…</div>
  <div class="updated" id="updated" style="margin-top:6px"></div>

  <section class="stats" id="stats"></section>
  <section class="typepanel" id="typePanel" hidden></section>
  <p class="statnote" id="statnote">当前只有示例数据，统计从 0 开始；录入第一道真实错题后会自动更新。</p>

  <section class="toolbar">
    <div class="searchrow">
      <input id="search" type="search" placeholder="搜索题目、错答、错因或标签…" autocomplete="off">
      <label class="demotoggle" id="demoWrap" hidden>
        <input type="checkbox" id="showDemo"> 显示示例
      </label>
    </div>
    <div class="chips" id="chips"></div>
    <div class="chips subchips" id="subchips" hidden></div>
    <div class="fl-row">
      <button class="action ghost" id="newUpload" type="button" hidden>上传新题</button>
      <button class="action" id="dlAll" type="button" hidden>下载同类练习（Word · 自选题数）</button>
    </div>
    <p class="pending" id="pendingNote" hidden></p>
  </section>

  <main class="cards" id="cards"></main>

  <footer>
    练习记录保存在云端数据库，换手机打开也能看到<br>
    这是一个公开链接：拿到链接的人都能查看错题内容
  </footer>
</div>

<div class="modal" id="modal" aria-hidden="true">
  <div class="modal-inner">
    <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
    <img id="modalImg" alt="题目图片">
  </div>
</div>

<div class="modal" id="dlModal" aria-hidden="true">
  <div class="picker" role="dialog" aria-modal="true" aria-labelledby="dlTitle">
    <div class="picker-head">
      <h3 id="dlTitle">下载同类练习</h3>
      <button class="picker-close" id="dlClose" type="button" aria-label="关闭">×</button>
    </div>
    <p class="picker-tip">按题型设置道数；超过现成题目数量时按现成数量出题。</p>
    <div class="picker-list" id="dlList"></div>
    <div class="picker-foot">
      <span id="dlTotal"></span>
      <button class="picker-cancel" id="dlCancel" type="button">取消</button>
      <button class="action" id="dlConfirm" type="button">生成 Word</button>
    </div>
  </div>
</div>

<div class="modal sheet" id="logModal" aria-hidden="true">
  <div class="sheet-inner" role="dialog" aria-modal="true" aria-labelledby="logTitle">
    <div class="fhead">
      <h3 id="logTitle">登记练习记录</h3>
      <button class="x" id="logClose" type="button" aria-label="关闭">×</button>
    </div>
    <p class="fhint">做完同类练习后，把日期、题数和答对题数填进来，统计会自动更新。</p>
    <form id="logForm">
      <label class="field">
        <span>对应错题</span>
        <select id="logProblem" required></select>
      </label>
      <label class="field">
        <span>练习日期</span>
        <input id="logDate" type="date" required>
      </label>
      <div class="frow">
        <label class="field">
          <span>练习题数</span>
          <input id="logTotal" type="number" min="1" max="200" inputmode="numeric" placeholder="10" required>
        </label>
        <label class="field">
          <span>答对题数</span>
          <input id="logCorrect" type="number" min="0" max="200" inputmode="numeric" placeholder="8" required>
        </label>
      </div>
      <label class="field">
        <span>备注（可选）</span>
        <input id="logNote" type="text" maxlength="200" placeholder="例如：第 5 题看错单位">
      </label>
      <p class="ferror" id="logError"></p>
      <div class="factions">
        <button class="ghost" id="logCancel" type="button">取消</button>
        <button class="action" id="logSubmit" type="submit">保存记录</button>
      </div>
    </form>
  </div>
</div>

<input id="uploadFile" type="file" accept="image/*,.pdf,.doc,.docx" multiple hidden>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="data/problems.js"></script>
<script>
(function () {
  const CFG = window.NOTEBOOK_CONFIG || {};
  const SB_URL = String(CFG.supabaseUrl || '').replace(/\/+$/, '');
  const SB_KEY = String(CFG.supabaseAnonKey || '');
  const hasCloud = !!(SB_URL && SB_KEY);
  const raw = window.PROBLEMS || { problems: [], types: [] };
  const state = { type: 'all', subtype: 'all', query: '', showDemo: false, newOnly: false };
  let serverLogs = [];
  let remoteProblems = [];
  let notebookUploads = [];
  let uploadsReady = false;
  let all = [];
  let real = [];
  let newItems = [];
  let learnable = [];
  let demoCount = 0;
  let logKey = '';

  const $ = sel => document.querySelector(sel);
  const esc = s => String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');

  function uuid() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
      const r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 3 | 8)).toString(16);
    });
  }

  function normalize(p) {
    const log = (Array.isArray(p.practice_log) ? p.practice_log : []).slice();
    let total = 0, correct = 0;
    log.forEach(e => {
      total += Number(e.total) || 0;
      correct += Number(e.correct) || 0;
    });
    const similar = Array.isArray(p.similar) ? p.similar : [];
    return Object.assign({}, p, {
      practiceLog: log,
      similar: similar,
      sessions: log.length,
      answered: total,
      correct: correct,
      accuracy: total ? Math.round(correct / total * 100) : null,
      tags: Array.isArray(p.tags) ? p.tags : [],
      subtype: p.subtype || '',
      isNew: !!(p.isNew || p.status === 'new'),
      clean_image: p.clean_image || p.image_url || '',
      origin_image: ''
    });
  }

  function buildAll() {
    const base = (raw.problems || []).concat(remoteProblems);
    all = base.map(p => {
      const extra = serverLogs
        .filter(l => l.problem_id === p.id)
        .map(l => ({ date: l.practice_date, total: l.total, correct: l.correct, note: l.note || '' }));
      return normalize(Object.assign({}, p, { practice_log: (p.practice_log || []).concat(extra) }));
    });
    learnable = all.filter(p => !p.demo);
    real = learnable.filter(p => !p.isNew);
    newItems = learnable.filter(p => p.isNew);
    demoCount = all.length - learnable.length;
  }

  function fmtAccuracy(a) {
    if (a == null) return { text: '未练习', cls: '' };
    return { text: a + '%', cls: a >= 80 ? 'good' : a >= 60 ? 'mid' : 'bad' };
  }

  function localDate() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  function safeName(s) {
    return String(s || '').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 80);
  }

  function downloadWord(filename, html) {
    const blob = new Blob(['\ufeff', html], { type: 'application/msword;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  }

  function buildTypeGroups() {
    const map = new Map();
    learnable.forEach(p => {
      if (!p.type) return;
      if (!map.has(p.type)) {
        map.set(p.type, { type: p.type, problems: [], subtypes: new Map(), seen: new Set(), available: 0 });
      }
      const g = map.get(p.type);
      g.problems.push(p);
      const sub = p.subtype || '';
      if (!g.subtypes.has(sub)) g.subtypes.set(sub, { subtype: sub, items: [] });
      const bucket = g.subtypes.get(sub);
      p.similar.forEach(s => {
        const q = String(s.q || '').trim();
        if (!q || g.seen.has(q)) return;
        g.seen.add(q);
        bucket.items.push({ q: s.q, a: s.a, pid: p.id || '' });
        g.available++;
      });
    });
    return [...map.values()]
      .filter(g => g.available > 0)
      .sort((a, b) => b.problems.length - a.problems.length || a.type.localeCompare(b.type, 'zh'));
  }

  function pickGroupItems(g, count) {
    const buckets = [...g.subtypes.values()].filter(b => b.items.length);
    const taken = new Map(buckets.map(b => [b, []]));
    let left = Math.min(count, g.available);
    while (left > 0) {
      let moved = false;
      for (const b of buckets) {
        if (left <= 0) break;
        const list = taken.get(b);
        if (list.length >= b.items.length) continue;
        list.push(b.items[list.length]);
        left--;
        moved = true;
      }
      if (!moved) break;
    }
    return buckets
      .map(b => ({
        heading: g.type + (b.subtype ? ' · ' + b.subtype : ''),
        items: taken.get(b)
      }))
      .filter(sec => sec.items.length);
  }

  let dlGroups = [];
  let dlCounts = new Map();

  function openDlDialog() {
    dlGroups = buildTypeGroups();

  function downloadSelectedTypesDoc() {
    const sections = [];
    const covered = new Set();
    const types = new Set();
    dlGroups.forEach(g => {
      const n = dlCounts.get(g.type) || 0;
      if (!n) return;
      const picked = pickGroupItems(g, n);
      if (!picked.length) return;
      types.add(g.type);
      picked.forEach(sec => {
        sec.items.forEach(it => { if (it.pid) covered.add(it.pid); });
        sections.push(sec);
      });
    });
    if (!sections.length) return;
    const count = sections.reduce((s, x) => s + x.items.length, 0);
    const meta = `覆盖 ${covered.size} 道错题、${types.size} 个题型 ｜ 按题型指定题数 ｜ 共 ${count} 题`;
    downloadWord(
      safeName(`同类练习_按题型_${localDate()}.doc`),
      buildWordDoc({ title: '二年级数学 · 同类练习（按题型）', meta, sections })
    );
    closeDlDialog();
  }

  function renderStats() {
    const types = new Set(learnable.map(p => (p.type ? (p.subtype ? `${p.type}·${p.subtype}` : p.type) : '')).filter(Boolean));
    const sessions = learnable.reduce((s, p) => s + p.sessions, 0);

    $('#stats').innerHTML = [
      ['错题总数', real.length + '<small>道</small>'],
      ['待练新题', newItems.filter(p => p.sessions === 0).length + '<small>道</small>'],
      ['覆盖题型', types.size + '<small>类</small>'],
      ['累计练习', sessions + '<small>次</small>'],
      ['平均正确率', acc]
    ].map(([k, v]) => {
      const clickable = k === '覆盖题型' && learnable.length > 0;
      return `<div class="stat${clickable ? ' clickable' : ''}"${clickable ? ' data-stat="types" role="button" tabindex="0" title="点击查看各细分题型" aria-expanded="false"' : ''}>

  function renderChips() {
    const pool = all.filter(p => !p.demo || state.showDemo);
    const counts = new Map();
    pool.forEach(p => { if (p.type) counts.set(p.type, (counts.get(p.type) || 0) + 1); });
    const newCount = pool.filter(p => p.isNew).length;
    const items = [['all', '全部', pool.length]];
    if (newCount) items.push(['__new', '新题', newCount]);
    [...counts.entries()].sort((a, b) => b[1] - a[1]).forEach(([t, n]) => items.push([t, t, n]));

    $('#chips').innerHTML = items.map(([val, label, n]) => {
      const on = val === '__new' ? state.newOnly : (!state.newOnly && state.type === val);
      return `<button class="chip ${on ? 'on' : ''}" data-type="${esc(val)}">${esc(label)}<span class="n">${n}</span></button>`;
    }).join('');

    const subHost = $('#subchips');
    const typePool = state.newOnly || state.type === 'all' ? [] : pool.filter(p => p.type === state.type);
    const subs = new Map();
    typePool.forEach(p => { if (p.subtype) subs.set(p.subtype, (subs.get(p.subtype) || 0) + 1); });
    if (!subs.size) {
      subHost.hidden = true;
      subHost.innerHTML = '';
      return;
    }
    subHost.hidden = false;
    const subItems = [['all', '全部细分', typePool.length]];
    [...subs.entries()].sort((a, b) => b[1] - a[1]).forEach(([s, n]) => subItems.push([s, s, n]));
    subHost.innerHTML = subItems.map(([val, label, n]) =>
      `<button class="chip ${state.subtype === val ? 'on' : ''}" data-subtype="${esc(val)}">${esc(label)}<span class="n">${n}</span></button>`
    ).join('');
  }

    return '保存失败，请稍后重试。';

  async function sbFetch(path, init) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    const headers = Object.assign(
      { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY },
      (init && init.headers) || {}
    );
    try {
      const res = await fetch(SB_URL + path, Object.assign({}, init, { headers, signal: ctrl.signal }));
      let body = null;
      try { body = await res.json(); } catch (e) { body = null; }
      return { ok: res.ok, status: res.status, body };
    } catch (e) {
      const err = new Error('network_error');
      err.code = 'network_error';
      throw err;
    } finally {
      clearTimeout(timer);
    }
  }

      return;
    }
    setSync('正在读取练习记录…');
    try {
      const r = await sbFetch('/rest/v1/practice_logs?select=id,problem_id,practice_date,total,correct,note&order=created_at.asc&limit=500');
      if (!r.ok) throw Object.assign(new Error('http'), { code: (r.body && r.body.code) || r.status });
      serverLogs = Array.isArray(r.body) ? r.body : [];
      buildAll(); renderStats(); renderChips(); renderCards();
      setSync(serverLogs.length
        ? `已同步 ${serverLogs.length} 条练习记录`
        : '云端记录已连接，做完练习可随时登记', 'ok');
    } catch (e) {
      setSync('练习记录暂时连不上；查看和下载不受影响。', 'warn');
    }
  }

  const MIME_BY_EXT = {
    jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png',
    heic: 'image/heic', heif: 'image/heif',
    pdf: 'application/pdf', doc: 'application/msword',
    docx: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
  };

  function extOf(name) {
    const m = String(name || '').toLowerCase().match(/\.([a-z0-9]{1,8})$/);
    return m ? m[1] : '';
  }

  function mimeFor(file) {
    return MIME_BY_EXT[extOf(file.name)] || file.type || 'application/octet-stream';
  }

  async function uploadOne(file) {
    const key = uuid();
    const ext = extOf(file.name) || 'bin';
    const path = key + '.' + ext;
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 60000);
    let res;
    try {
      res = await fetch(`${SB_URL}/storage/v1/object/${UPLOAD_BUCKET}/${encodeURIComponent(path)}`, {
        method: 'POST',
        headers: {
          apikey: SB_KEY,
          Authorization: 'Bearer ' + SB_KEY,
          'content-type': mimeFor(file),
          'x-upsert': 'false'
        },
        body: file,
        signal: ctrl.signal
      });
    } catch (e) {
      throw Object.assign(new Error('upload_failed'), { code: 'upload_failed' });
    } finally {
      clearTimeout(timer);
    }
    if (!res.ok) throw Object.assign(new Error('upload_failed'), { code: 'upload_' + res.status });

    const r = await sbFetch('/rest/v1/notebook_uploads', {
      method: 'POST',
      headers: { 'content-type': 'application/json', Prefer: 'return=minimal' },
      body: JSON.stringify({
        client_key: key,
        object_path: path,
        file_name: String(file.name || '').slice(0, 120),
        mime_type: mimeFor(file)
      })
    });
    if (!r.ok) throw Object.assign(new Error('record_failed'), { code: (r.body && (r.body.code || r.body.message)) || r.status });
    return key;
  }

  async function handleFiles(files) {
    if (!hasCloud) { showToast('云端尚未配置，暂时不能上传'); return; }
    const list = Array.from(files || []);
    if (!list.length) return;
    const note = $('#pendingNote');
    let done = 0, skipped = 0;
    let i = 0;
    for (const file of list) {
      i += 1;
      if (file.size > MAX_UPLOAD) { skipped += 1; continue; }
      note.hidden = false;
      note.textContent = `正在上传 ${i}/${list.length}：${String(file.name || '').slice(0, 18)}`;
      try {
        await uploadOne(file);
        done += 1;
      } catch (e) {
        skipped += 1;
      }
    }
    note.hidden = true;
    await loadNewContent();
    if (done) {
      showToast(skipped
        ? `已上传 ${done} 份，${skipped} 份没传上；跟我说「同步新题」`
        : `已上传 ${done} 份，跟我说「同步新题」`);
    } else {
      showToast('没有文件上传成功，请检查格式或网络');
    }
  }

  let newContentSeq = 0;

  async function loadNewContent() {
    if (!hasCloud) { renderPending(); return; }
    const seq = ++newContentSeq;
    try {
      const [up, pr] = await Promise.all([
        sbFetch(`/rest/v1/notebook_uploads?select=client_key,object_path,file_name,mime_type,created_at&order=created_at.desc&limit=200`),
        sbFetch(`/rest/v1/notebook_problems?select=client_key,source_key,payload,created_at&order=created_at.asc&limit=500`)
      ]);
      if (seq !== newContentSeq) return;
      if (!up.ok && !pr.ok) throw new Error('not_ready');
      notebookUploads = up.ok && Array.isArray(up.body) ? up.body : [];
      const rows = pr.ok && Array.isArray(pr.body) ? pr.body : [];
      remoteProblems = rows
        .filter(r => r && r.payload && r.payload.id)
        .map(r => Object.assign({}, r.payload, { isNew: true, source_key: r.source_key || '' }));
      uploadsReady = true;
      buildAll();
      if (real.length && state.showDemo) {
        state.showDemo = false;
        $('#showDemo').checked = false;
      }
      renderStats(); renderChips(); renderCards();
      if (learnable.length) {
        const btn = $('#dlAll');
        btn.hidden = false;
        btn.onclick = openDlDialog;
      }
    } catch (e) {
      if (seq !== newContentSeq) return;
      uploadsReady = false;
    }
    renderPending();
  }

  function renderPending() {
    const btn = $('#newUpload');
    const note = $('#pendingNote');
    if (btn) btn.hidden = !(hasCloud && uploadsReady);
    if (!note) return;
    if (!hasCloud) { note.hidden = true; return; }
    if (!uploadsReady) {
      note.hidden = false;
      note.textContent = '新题上传暂时不可用：请确认已在 Supabase 执行 supabase/uploads.sql，并检查网络。';
      return;
    }
    const processed = new Set(remoteProblems.map(p => p.source_key).filter(Boolean));
    const pending = notebookUploads.filter(u => u && !processed.has(u.client_key)).length;
    if (!pending) { note.hidden = true; return; }
    note.hidden = false;
    note.textContent = `有 ${pending} 份新题待整理：跟我说「同步新题」，整理后会出现在下面。`;
  }

  async function submitLog(e) {
    e.preventDefault();
    if (!hasCloud) {
      $('#logError').textContent = '云端记录尚未配置，暂时不能保存。';
      return;
    }
    const problemId = $('#logProblem').value;
    const date = $('#logDate').value;
    const total = Number($('#logTotal').value);
    const correct = Number($('#logCorrect').value);
    const note = $('#logNote').value.trim();
    const err = $('#logError');
    err.textContent = '';

    if (!problemId) return (err.textContent = '请选择对应错题。');
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return (err.textContent = '请选择练习日期。');
    if (!Number.isInteger(total) || total < 1 || total > 200) return (err.textContent = '练习题数需在 1–200 之间。');
    if (!Number.isInteger(correct) || correct < 0 || correct > total) return (err.textContent = '答对题数应在 0 到练习题数之间。');

    const btn = $('#logSubmit');
    btn.disabled = true;
    btn.textContent = '保存中…';
    try {
      const r = await sbFetch('/rest/v1/practice_logs?on_conflict=client_key', {
        method: 'POST',
        headers: {
          'content-type': 'application/json',
          Prefer: 'resolution=ignore-duplicates,return=representation'
        },
        body: JSON.stringify({
          client_key: logKey,
          problem_id: problemId,
          practice_date: date,
          total: total,
          correct: correct,
          note: note || null
        })
      });
      if (!r.ok) throw Object.assign(new Error('http'), { code: (r.body && (r.body.code || r.body.message)) || r.status });
      let saved = Array.isArray(r.body) ? r.body[0] : null;
      if (!saved) {
        const ex = await sbFetch('/rest/v1/practice_logs?select=id,problem_id,practice_date,total,correct,note&client_key=eq.' + encodeURIComponent(logKey));
        if (ex.ok && Array.isArray(ex.body)) saved = ex.body[0] || null;
      }
      if (!saved) throw Object.assign(new Error('http'), { code: 'write_conflict' });
      serverLogs.push(saved);
      buildAll(); renderStats(); renderChips(); renderCards();
      closeLog();
      showToast(`已登记：${correct}/${total}（${Math.round(correct / total * 100)}%）`);
      setSync(`已同步 ${serverLogs.length} 条练习记录`, 'ok');
    } catch (ex) {
      err.textContent = errText(ex.code || 'request_failed');
    } finally {
      btn.disabled = false;
      btn.textContent = '保存记录';
    }
  }

  $('#search').addEventListener('input', e => {
    state.query = e.target.value;
    renderCards();
  });

  $('#chips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    const val = chip.dataset.type;
    state.newOnly = val === '__new';
    state.type = state.newOnly ? 'all' : val;
    state.subtype = 'all';
    renderChips();
    renderCards();
  });

  $('#subchips').addEventListener('click', e => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    state.subtype = chip.dataset.subtype;
    renderChips();
    renderCards();
  });

  $('#stats').addEventListener('click', e => {
    const card = e.target.closest('[data-stat="types"]');
    if (!card) return;
    const panel = $('#typePanel');
    if (panel.hidden) {
      renderTypePanel();
      panel.hidden = false;
      card.setAttribute('aria-expanded', 'true');
    } else {
      panel.hidden = true;
      card.setAttribute('aria-expanded', 'false');
    }
  });

  $('#stats').addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    const card = e.target.closest('[data-stat="types"]');
    if (!card) return;
    e.preventDefault();
    card.click();
  });

  $('#typePanel').addEventListener('click', e => {
    const panel = $('#typePanel');
    const card = $('[data-stat="types"]');
    if (e.target.closest('.pclose')) {
      panel.hidden = true;
      if (card) card.setAttribute('aria-expanded', 'false');
      return;
    }
    const row = e.target.closest('.typerow');
    if (!row) return;
    state.newOnly = false;
    state.type = row.dataset.type || 'all';
    state.subtype = row.dataset.subtype || 'all';
    renderChips();
    renderCards();
    panel.hidden = true;
    if (card) card.setAttribute('aria-expanded', 'false');
    $('#cards').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  $('#showDemo').addEventListener('change', e => {
    state.showDemo = e.target.checked;
    state.subtype = 'all';
    renderChips();
    renderCards();
  });

  $('#cards').addEventListener('click', e => {
    const dl = e.target.closest('.dl');
    if (dl) { downloadProblemDoc(dl.dataset.id); return; }
    const logbtn = e.target.closest('.logbtn');
    if (logbtn) { openLog(logbtn.dataset.log); return; }
    const thumb = e.target.closest('.thumb');
    if (thumb) { openModal(thumb.dataset.img); return; }
    const more = e.target.closest('.more');
    if (more) {
      const details = more.closest('.body').querySelector('.details');
      details.classList.toggle('open');
      more.textContent = details.classList.contains('open') ? '收起详情' : '展开详情';
    }
  });

  $('#logNew').addEventListener('click', () => openLog(''));
  $('#logClose').addEventListener('click', closeLog);
  $('#logCancel').addEventListener('click', closeLog);
  $('#logForm').addEventListener('submit', submitLog);
  $('#logModal').addEventListener('click', e => { if (e.target === $('#logModal')) closeLog(); });

  $('#newUpload').addEventListener('click', () => $('#uploadFile').click());
  $('#uploadFile').addEventListener('change', e => {
    const input = e.target;
    handleFiles(input.files).finally(() => { input.value = ''; });
  });

  $('#modalClose').addEventListener('click', closeModal);
  $('#modal').addEventListener('click', e => { if (e.target === $('#modal')) closeModal(); });
  $('#dlClose').addEventListener('click', closeDlDialog);
  $('#dlCancel').addEventListener('click', closeDlDialog);
  $('#dlModal').addEventListener('click', e => { if (e.target === $('#dlModal')) closeDlDialog(); });
  $('#dlConfirm').addEventListener('click', downloadSelectedTypesDoc);
  $('#dlList').addEventListener('input', e => {
    const input = e.target.closest('input[data-type]');
    if (!input) return;
    const g = dlGroups.find(x => x.type === input.dataset.type);
    if (!g) return;
    let n = Math.floor(Number(input.value));
    if (!Number.isFinite(n) || n < 0) n = 0;
    if (n > g.available) n = g.available;
    if (String(n) !== input.value) input.value = n;
    dlCounts.set(g.type, n);
    updateDlTotal();
  });
  document.addEventListener('keydown', e => {
    if (e.key !== 'Escape') return;
    closeModal();
    closeLog();
    closeDlDialog();
  });

  const demoWrap = $('#demoWrap');
  const dlAll = $('#dlAll');

  function refreshStatic() {
    buildAll();
    state.showDemo = real.length === 0 && newItems.length === 0;
    if (demoCount > 0) {
      demoWrap.hidden = false;
      $('#showDemo').checked = state.showDemo;
    }
    if (learnable.length) {
      dlAll.hidden = false;
      dlAll.onclick = openDlDialog;
    }
    renderStats();
    renderChips();
    renderCards();
  }

  refreshStatic();
  loadLogs();
  loadNewContent();
})();
</script>
</body>
</html>
